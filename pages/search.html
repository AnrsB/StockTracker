<!-- ============================================
     SEARCH.HTML - Stock Search & Research Page
     ============================================ -->

<div id="page-search" class="page" style="display: none;">
    <div class="container">
        <!-- Page Header -->
        <div style="margin-bottom: var(--spacing-xl);">
            <h1>Search Stocks</h1>
            <p class="text-muted">Find and research stocks to add to your portfolio</p>
        </div>

        <!-- Search Section -->
        <div class="card" style="margin-bottom: var(--spacing-xl);">
            <div class="search-container">
                <div class="search-input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" 
                           id="search-input" 
                           class="form-control" 
                           placeholder="Search by ticker or company name (e.g., AAPL or Apple)"
                           style="width: 100%; padding: var(--spacing-md) var(--spacing-lg); padding-left: var(--spacing-lg);">
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>
            </div>
        </div>

        <!-- Search Results -->
        <div id="search-results" class="search-results">
            <div class="empty-state">
                <i class="fas fa-search"></i>
                <h3>No search results yet</h3>
                <p>Search for a stock ticker or company name to get started</p>
            </div>
        </div>

        <!-- Stock Details Modal -->
        <div id="stock-details-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Stock Details</h2>
                    <button class="modal-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="modal-body">
                    <!-- Stock Header -->
                    <div style="margin-bottom: var(--spacing-lg);">
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div>
                                <h3 id="details-ticker" style="color: var(--primary-color); margin: 0;">TICKER</h3>
                                <p id="details-name" class="text-muted" style="margin: var(--spacing-xs) 0 0 0;"></p>
                                <span id="details-sector" class="badge badge-primary" style="margin-top: var(--spacing-sm);"></span>
                            </div>
                            <div style="text-align: right;">
                                <div id="details-price" style="font-size: 1.75rem; font-weight: bold;"></div>
                                <div id="details-change" style="margin-top: var(--spacing-sm);"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Quote Data -->
                    <div class="card" style="margin-bottom: var(--spacing-lg);">
                        <h4>Quote Data</h4>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--spacing-md);">
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">Open</label>
                                <div id="details-open" style="font-weight: bold;"></div>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">High</label>
                                <div id="details-high" style="font-weight: bold;"></div>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">Low</label>
                                <div id="details-low" style="font-weight: bold;"></div>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">Previous Close</label>
                                <div id="details-previous-close" style="font-weight: bold;"></div>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">Volume</label>
                                <div id="details-volume" style="font-weight: bold;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Price Chart -->
                    <div class="chart-container" style="margin-bottom: var(--spacing-lg);">
                        <div class="chart-controls">
                            <button class="chart-button active" data-timeframe="24h">24h</button>
                            <button class="chart-button" data-timeframe="1w">1W</button>
                            <button class="chart-button" data-timeframe="1m">1M</button>
                            <button class="chart-button" data-timeframe="1y">1Y</button>
                            <button class="chart-button" data-timeframe="all">All</button>
                        </div>
                        <canvas id="price-chart" style="max-height: 100%;"></canvas>
                    </div>

                    <!-- Company Info -->
                    <div class="card" style="margin-bottom: var(--spacing-lg);">
                        <h4>Company Info</h4>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--spacing-md);">
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">IPO Date</label>
                                <div id="details-ipo" style="font-weight: bold;"></div>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">Market Cap</label>
                                <div id="details-market-cap" style="font-weight: bold;"></div>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">P/E Ratio</label>
                                <div id="details-pe-ratio" style="font-weight: bold;"></div>
                            </div>
                            <div>
                                <label style="font-size: 0.85rem; color: var(--muted-color);">Dividend Yield</label>
                                <div id="details-dividend" style="font-weight: bold;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="card" style="margin-bottom: var(--spacing-lg);">
                        <h4>About</h4>
                        <p id="details-description" style="margin: 0; line-height: 1.6;"></p>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary modal-close">Close</button>
                    <button class="btn btn-primary" id="add-to-watchlist-btn">
                        <i class="fas fa-bookmark"></i> Add to Watchlist
                    </button>
                    <button class="btn btn-success" id="add-to-wallet-btn">
                        <i class="fas fa-plus"></i> Add to Wallet
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
